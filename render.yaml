services:
  - type: web
    name: hamza-shouq-whatsapp-bridge
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/bridge/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: WEB_ORIGIN
        value: https://web-zsfaouris-projects.vercel.app
      - key: APP_BASE_URL
        value: https://web-zsfaouris-projects.vercel.app
      - key: WHATSAPP_SESSION_PATH
        value: /var/data/wwebjs_auth
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: BRIDGE_AUTO_START
        value: true
      - key: BRIDGE_RECONNECT_MS
        value: 15000
      - key: BRIDGE_TOKEN
        sync: false
    disk:
      name: whatsapp-session
      mountPath: /var/data
      sizeGB: 1
